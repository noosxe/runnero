services:
  # All-in-One Multi-Provider Runner Supervisor Stack
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile.supervisor
    # Local dev/test stack (not a prod deployment template): runs the image
    # built from this working tree — `make build-image-supervisor` (or
    # `docker compose build`) tags it :local, matching this reference.
    image: ghcr.io/noosxe/runnero-supervisor:local
    container_name: runnero-supervisor
    restart: unless-stopped
    ports:
      - "${SUPERVISOR_PORT:-8090}:8090"
    environment:
      # Safe dev fallback allows instant 'docker compose up' without manual .env creation
      - SUPERVISOR_DB_ENCRYPTION_KEY=${SUPERVISOR_DB_ENCRYPTION_KEY:-dev-insecure-master-encryption-key-for-local-testing-32b}
      # Fixed internal container port; host port controlled by SUPERVISOR_PORT in ports mapping
      - SUPERVISOR_PORT=8090
      - SUPERVISOR_LOG_LEVEL=${SUPERVISOR_LOG_LEVEL:-debug}
      - SUPERVISOR_DOCKER_HOST=${SUPERVISOR_DOCKER_HOST:-unix:///var/run/docker.sock}
      - SUPERVISOR_DATA_DIR=${SUPERVISOR_DATA_DIR:-/data}
      - SUPERVISOR_BACKUP_INTERVAL_HOURS=${SUPERVISOR_BACKUP_INTERVAL_HOURS:-6}
      - SUPERVISOR_BACKUP_RETENTION_COUNT=${SUPERVISOR_BACKUP_RETENTION_COUNT:-7}
      - SUPERVISOR_SECURE_COOKIE=${SUPERVISOR_SECURE_COOKIE:-false}
      # Webhook receiver secrets (docs/03 §4): set in .env to enable real-time
      # autoscaling per provider; leave empty to keep the endpoint disabled
      - SUPERVISOR_WEBHOOK_GITHUB_SECRET=${SUPERVISOR_WEBHOOK_GITHUB_SECRET:-}
      - SUPERVISOR_WEBHOOK_GITEA_SECRET=${SUPERVISOR_WEBHOOK_GITEA_SECRET:-}
      - SUPERVISOR_WEBHOOK_FORGEJO_SECRET=${SUPERVISOR_WEBHOOK_FORGEJO_SECRET:-}
      # Embedded Tailscale (docs/26): off unless the auth key is set. Outbound-only;
      # no ports are published and no extra volumes are mounted (state lives in /data).
      - SUPERVISOR_TAILSCALE_AUTHKEY=${SUPERVISOR_TAILSCALE_AUTHKEY:-}
      - SUPERVISOR_TAILSCALE_HOSTNAME=${SUPERVISOR_TAILSCALE_HOSTNAME:-runnero}
      - SUPERVISOR_TAILSCALE_FUNNEL=${SUPERVISOR_TAILSCALE_FUNNEL:-true}
      - SUPERVISOR_TAILSCALE_UI=${SUPERVISOR_TAILSCALE_UI:-true}
      - SUPERVISOR_TAILSCALE_STATE_DIR=${SUPERVISOR_TAILSCALE_STATE_DIR:-}
    volumes:
      # Persistent SQLite database, backups, and compressed runner execution logs
      - supervisor-data:/data
      # Docker daemon socket to spawn ephemeral runner containers (see security note in README)
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # /readyz is the strictest useful signal: a 200 requires the database and
      # the pool control loop to pass, while a Docker outage stays 200 "degraded"
      # (docs/02 §5) — exactly what compose should tolerate. /healthz adds
      # nothing: the server answering /readyz proves liveness, and its only
      # probe (db ping) duplicates a readiness check. Not-ready answers 503,
      # which curl -f turns into an unhealthy container.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      # s6 init (socket-perm adaptation) plus migrations can outlast a cold
      # curl; failures inside start_period do not count against retries.
      start_period: 30s

  # Optional Standalone Static Runner (Single repository, no supervisor daemon)
  runner:
    profiles: ["runner-standalone"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GH_RUNNER_VERSION=2.337.0
    # :local matches `make build-image-runner` (see supervisor note above)
    image: ghcr.io/noosxe/runnero:local
    container_name: runnero
    init: true
    restart: unless-stopped
    environment:
      - GITHUB_REPOSITORY_URL=${GITHUB_REPOSITORY_URL:-}
      - RUNNER_TOKEN=${RUNNER_TOKEN:-}
      - RUNNER_NAME=${RUNNER_NAME:-runnero}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,linux,arm64}
      - RUNNER_WORKDIR=${RUNNER_WORKDIR:-_work}
    volumes:
      # Docker daemon socket, read-write: docker-enabled pools run workflow
      # containers as siblings of the runner (DooD) — the same host-root
      # equivalent exposure as the supervisor's mount. See the Docker socket
      # security note in README and the runner-side boundary in docs/05 §4.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # Provider-agnostic liveness: pgrep matches whichever runner binary
      # entrypoint.sh exec'd — Runner.Listener (GitHub), act_runner (Gitea),
      # forgejo-runner (Forgejo). procps is installed in the runtime stage
      # for this probe. start_period covers first registration, which needs a
      # reachable provider. Compose health status is informational here:
      # `restart` reacts to process exits, not to unhealthy. The image
      # deliberately carries no HEALTHCHECK instruction — the same image runs
      # as ephemeral supervisor-spawned job containers, where health status
      # would be meaningless noise (docs/02 §5).
      test: ["CMD-SHELL", "pgrep -f 'Runner.Listener|act_runner|forgejo-runner' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  supervisor-data:
    name: supervisor-data
