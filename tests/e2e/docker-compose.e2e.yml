name: runnero-e2e

networks:
  e2e-net:
    driver: bridge

services:
  e2e-mock-provider:
    build:
      context: ../..
      dockerfile_inline: |
        FROM golang:1.27-alpine
        WORKDIR /app
        COPY tests/e2e/mock/provider/main.go ./
        RUN CGO_ENABLED=0 go build -o /app/mock-provider ./main.go
        EXPOSE 8095
        CMD ["/app/mock-provider"]
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8095/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5

  e2e-mock-docker:
    build:
      context: ../..
      dockerfile_inline: |
        FROM golang:1.27-alpine
        WORKDIR /app
        COPY tests/e2e/mock/docker/main.go ./
        RUN CGO_ENABLED=0 go build -o /app/mock-docker ./main.go
        EXPOSE 2375
        CMD ["/app/mock-docker"]
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2375/_ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  e2e-supervisor:
    build:
      context: ../..
      dockerfile: Dockerfile.supervisor
    depends_on:
      e2e-mock-provider:
        condition: service_healthy
      e2e-mock-docker:
        condition: service_healthy
    environment:
      - SUPERVISOR_PORT=8090
      - SUPERVISOR_DB_ENCRYPTION_KEY=e2e-testing-super-secret-master-key-min-32-bytes!
      - SUPERVISOR_DATA_DIR=/data
      - SUPERVISOR_LOG_LEVEL=debug
      - SUPERVISOR_DOCKER_HOST=tcp://e2e-mock-docker:2375
      - GITHUB_BASE_URL=http://e2e-mock-provider:8095
      - GITEA_BASE_URL=http://e2e-mock-provider:8095
      - FORGEJO_BASE_URL=http://e2e-mock-provider:8095
      # Webhook receiver (RUN-253, docs/13 section 3.2): configuring the
      # GitHub HMAC secret mounts POST /hooks/github so flow 14 can deliver
      # signed workflow_job events and drive a real job lifecycle.
      - SUPERVISOR_WEBHOOK_GITHUB_SECRET=runnero-e2e-webhook-secret
      # WebAuthn for the passkey flow (RUN-248, docs/34): RP ID localhost is
      # both go-webauthn-valid and a browser secure context over plain http
      # (docs/34 section 3.5 dev/E2E carve-out). The playwright container
      # shares this service's network namespace below, so the browser origin
      # is exactly http://localhost:8090.
      - SUPERVISOR_WEBAUTHN_RP_ID=localhost
      - SUPERVISOR_WEBAUTHN_ORIGINS=http://localhost:8090
    networks:
      - e2e-net
    # Liveness-only by design: the suite just needs a listening process
    # before Playwright starts. Readiness probes (docker reachability, pool
    # control loop) belong to scenario assertions, not the boot gate.
    # Endpoint contract: docs/02 §5.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10

  e2e-playwright:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.playwright
    depends_on:
      e2e-supervisor:
        condition: service_healthy
    # Share the supervisor's network namespace: the browser then reaches it
    # at http://localhost:8090 - a priori-trustworthy origin, so WebAuthn
    # ceremonies run in a real secure context with no Chromium flags
    # (RUN-248, docs/34 section 3.5). The browser never needs the mock
    # services directly; the supervisor talks to them over e2e-net.
    network_mode: "service:e2e-supervisor"
    environment:
      - PLAYWRIGHT_BASE_URL=http://localhost:8090
      - CI=true
