syntax = "proto3";

package supervisor.v1;

option go_package = "github.com/noosxe/runnero/internal/pb/supervisor/v1;supervisorv1";

// ----------------------------------------
// Authentication Service
// ----------------------------------------

service AuthService {
  // Setup the initial local administrator account
  rpc SetupAdmin (SetupAdminRequest) returns (SetupAdminResponse);

  // Login with local credentials to receive a session token
  rpc Login (LoginRequest) returns (LoginResponse);

  // Verify current session
  rpc GetSession (GetSessionRequest) returns (GetSessionResponse);
}

message SetupAdminRequest {
  string username = 1;
  string password = 2;
}

message SetupAdminResponse {
  bool success = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string username = 2;
}

message GetSessionRequest {}

message GetSessionResponse {
  string username = 1;
  bool is_admin = 2;
  string host_arch = 3;
  string host_os = 4;
}

// ----------------------------------------
// Pool Management Service
// ----------------------------------------

service PoolService {
  rpc ListPools (ListPoolsRequest) returns (ListPoolsResponse);
  rpc CreatePool (CreatePoolRequest) returns (CreatePoolResponse);
  rpc UpdatePool (UpdatePoolRequest) returns (UpdatePoolResponse);
  rpc DeletePool (DeletePoolRequest) returns (DeletePoolResponse);
  // WatchPools provides near-realtime server-streaming push of pool states and runner counts
  rpc WatchPools (WatchPoolsRequest) returns (stream WatchPoolsResponse);
  // ListRunners lists active container instances for a pool
  rpc ListRunners (ListRunnersRequest) returns (ListRunnersResponse);
  // TerminateRunner manually kills an active runner container instance
  rpc TerminateRunner (TerminateRunnerRequest) returns (TerminateRunnerResponse);
  // WatchRunners provides near-realtime server-streaming push of active runner instances
  rpc WatchRunners (WatchRunnersRequest) returns (stream WatchRunnersResponse);
  // DiscoverTargets queries available repositories or organizations from an auth profile
  rpc DiscoverTargets (DiscoverTargetsRequest) returns (DiscoverTargetsResponse);
}

enum PoolHealthStatus {
  POOL_HEALTH_STATUS_UNSPECIFIED = 0;
  POOL_HEALTH_STATUS_HEALTHY = 1;
  POOL_HEALTH_STATUS_PROVISIONING = 2;
  POOL_HEALTH_STATUS_DEGRADED = 3;
  POOL_HEALTH_STATUS_PAUSED = 4;
}

message Pool {
  int64 id = 1;
  string name = 2;
  string provider = 3;
  string repository_url = 4;
  int32 min_idle_runners = 5;
  int32 max_concurrency = 6;
  repeated string labels = 7;
  string runner_image = 8;
  bool allow_docker = 9;
  RenovateConfig renovate = 10;

  // Runtime stats (read-only, populated by server)
  int32 active_runners = 11;
  int32 idle_runners = 12;

  // Resource configuration
  int64 auth_profile_id = 13;
  string scope = 14;              // "repo", "org", or "global"
  string cpu_limit = 15;
  string memory_limit = 16;
  int32 max_runner_lifetime_seconds = 17;

  // Image update metadata
  bool image_update_available = 18;
  string latest_image = 19;

  // Multi-target URLs
  repeated string target_urls = 20;

  // Operational State & Diagnostics (read-only, populated by server)
  PoolHealthStatus health_status = 21;
  string current_intent = 22;
  string last_error = 23;
  string last_error_code = 24;
  string last_error_timestamp = 25;
  string last_reconciled_at = 26;
}

message RenovateConfig {
  bool enabled = 1;
  string cron_schedule = 2;
  string image = 3;
}

message ListPoolsRequest {}

message ListPoolsResponse {
  repeated Pool pools = 1;
}

message CreatePoolRequest {
  Pool pool = 1;
}

message CreatePoolResponse {
  Pool pool = 1;
}

message UpdatePoolRequest {
  Pool pool = 1;
}

message UpdatePoolResponse {
  Pool pool = 1;
}

message DeletePoolRequest {
  int64 id = 1;
}

message DeletePoolResponse {
  bool success = 1;
}

message WatchPoolsRequest {
  int32 interval_ms = 1;
}

message WatchPoolsResponse {
  repeated Pool pools = 1;
}

message RunnerInstance {
  string container_id = 1;
  string name = 2;
  string pool_name = 3;
  string status = 4; // "idle", "busy", "degraded", "exited"
  string ip_address = 5;
  int64 uptime_seconds = 6;
  string spawned_at = 7;
  string cpu_limit = 8;
  string memory_limit = 9;
}

message ListRunnersRequest {
  int64 pool_id = 1;
}

message ListRunnersResponse {
  repeated RunnerInstance runners = 1;
}

message TerminateRunnerRequest {
  int64 pool_id = 1;
  string container_id = 2;
}

message TerminateRunnerResponse {
  bool success = 1;
}

message WatchRunnersRequest {
  int64 pool_id = 1;
  int32 interval_ms = 2;
}

message WatchRunnersResponse {
  repeated RunnerInstance runners = 1;
  int32 active_runners = 2;
  int32 idle_runners = 3;

  // Real-time operational diagnostics pushed over the stream
  PoolHealthStatus health_status = 4;
  string current_intent = 5;
  string last_error = 6;
  string last_error_code = 7;
  string last_error_timestamp = 8;
  string last_reconciled_at = 9;
}

message DiscoverTargetsRequest {
  int64 auth_profile_id = 1;
  string scope = 2; // "repo" or "org"
}

message DiscoveredTarget {
  string name = 1;
  string full_name = 2;
  string html_url = 3;
  string description = 4;
  bool is_private = 5;
  string avatar_url = 6;
}

message AppInstallation {
  int64 id = 1;
  string account_login = 2;
  string account_type = 3;  // "User" or "Organization"
  string html_url = 4;      // Direct configuration URL on GitHub
  string repository_selection = 5; // "all" or "selected"
}

message DiscoverTargetsResponse {
  repeated DiscoveredTarget targets = 1;
  string install_url = 2;
  repeated AppInstallation installations = 3;
}

// ----------------------------------------
// Auth Profile Management Service
// ----------------------------------------

service AuthProfileService {
  rpc ListAuthProfiles (ListAuthProfilesRequest) returns (ListAuthProfilesResponse);
  rpc CreateAuthProfile (CreateAuthProfileRequest) returns (CreateAuthProfileResponse);
  rpc DeleteAuthProfile (DeleteAuthProfileRequest) returns (DeleteAuthProfileResponse);
}

message AuthProfile {
  int64 id = 1;
  string name = 2;
  string auth_method = 3;         // "github_app", "gitea_token", "forgejo_token", "pat"
  int64 app_id = 4;               // GitHub App only
  bool has_private_key = 5;       // Read-only indicator (never exposes raw key)
  bool has_token = 6;             // Read-only indicator (never exposes raw token)
  string install_url = 7;
  int32 installations_count = 8;
}

message ListAuthProfilesRequest {}

message ListAuthProfilesResponse {
  repeated AuthProfile profiles = 1;
}

message CreateAuthProfileRequest {
  string name = 1;
  string auth_method = 2;
  int64 app_id = 3;               // GitHub App only
  bytes private_key = 4;          // GitHub App private key PEM (write-only)
  string token = 5;               // PAT or Gitea/Forgejo token (write-only)
}

message CreateAuthProfileResponse {
  AuthProfile profile = 1;
}

message DeleteAuthProfileRequest {
  int64 id = 1;
}

message DeleteAuthProfileResponse {
  bool success = 1;
}

// ----------------------------------------
// Onboarding Service
// ----------------------------------------

service OnboardingService {
  rpc GetOnboardingStatus (GetOnboardingStatusRequest) returns (GetOnboardingStatusResponse);
  rpc GetAppSettings (GetAppSettingsRequest) returns (GetAppSettingsResponse);
  rpc SetAppSetting (SetAppSettingRequest) returns (SetAppSettingResponse);
  rpc CompleteOnboarding (CompleteOnboardingRequest) returns (CompleteOnboardingResponse);
}

message GetOnboardingStatusRequest {}

message GetOnboardingStatusResponse {
  bool admin_created = 1;
  bool auth_profile_exists = 2;
  bool pool_exists = 3;
  bool setup_complete = 4;        // true when admin_created AND (onboarding_completed OR pool_exists)
  bool onboarding_completed = 5;  // true if CompleteOnboarding was invoked
  string host_arch = 6;
  string host_os = 7;
}

message CompleteOnboardingRequest {}

message CompleteOnboardingResponse {
  bool success = 1;
}

message GetAppSettingsRequest {}

message AppSettingEntry {
  string key = 1;
  string value = 2;
  string updated_at = 3;
}

message GetAppSettingsResponse {
  repeated AppSettingEntry settings = 1;
}

message SetAppSettingRequest {
  string key = 1;
  string value = 2;
}

message SetAppSettingResponse {
  string key = 1;
  string value = 2;
}

// ----------------------------------------
// Analytics & History Service
// ----------------------------------------

service AnalyticsService {
  rpc GetJobHistory (GetJobHistoryRequest) returns (GetJobHistoryResponse);
  rpc GetJobRecord (GetJobRecordRequest) returns (GetJobRecordResponse);
  rpc GetSystemStats (GetSystemStatsRequest) returns (GetSystemStatsResponse);
  // WatchDashboard provides near-realtime server-streaming push of dashboard statistics, pool states, and recent jobs
  rpc WatchDashboard (WatchDashboardRequest) returns (stream WatchDashboardResponse);
}

message JobRecord {
  int64 id = 1;
  int64 pool_id = 2;
  string runner_name = 3;
  string status = 4;
  string queued_at = 5;
  string started_at = 6;
  string completed_at = 7;
  double duration_seconds = 8;
  double queue_time_seconds = 9;
  string pool_name = 10;
}

message GetJobHistoryRequest {
  int64 pool_id = 1; // 0 for all
  int32 limit = 2;
  int32 offset = 3;
  string search = 4; // search by runner name
  string status = 5; // filter by status (e.g. success, failure, running)
}

message GetJobHistoryResponse {
  repeated JobRecord jobs = 1;
  int32 total_count = 2;
}

message GetJobRecordRequest {
  int64 job_id = 1;
}

message GetJobRecordResponse {
  JobRecord job = 1;
}

message LatencyBucket {
  string timestamp = 1;
  double avg_queue_seconds = 2;
  double avg_runtime_seconds = 3;
  int32 total_jobs = 4;
  int32 successful_jobs = 5;
  int32 failed_jobs = 6;
}

message GetSystemStatsRequest {
  int32 timeframe_hours = 1; // 0 defaults to 24h
}

message GetSystemStatsResponse {
  int32 total_active_runners = 1;
  int32 total_idle_runners = 2;
  double average_queue_time_seconds = 3;
  int32 total_jobs_24h = 4;
  int32 successful_jobs_24h = 5;
  int32 failed_jobs_24h = 6;
  double average_runtime_seconds = 7;
  double success_rate_percent = 8;
  repeated LatencyBucket queue_latency_trend = 9;
  string host_arch = 10;
  string host_os = 11;
}

message WatchDashboardRequest {
  int32 interval_ms = 1;
}

message WatchDashboardResponse {
  GetSystemStatsResponse stats = 1;
  repeated Pool pools = 2;
  repeated JobRecord recent_jobs = 3;
}

// ----------------------------------------
// Runner Log Service (OQ #14, #20)
// ----------------------------------------

service LogService {
  // Live streaming logs of an active runner container
  rpc StreamRunnerLogs (StreamRunnerLogsRequest) returns (stream LogChunk);

  // Historical logs for completed/exited runners
  rpc GetRunnerLogs (GetRunnerLogsRequest) returns (GetRunnerLogsResponse);
}

message StreamRunnerLogsRequest {
  string runner_id = 1;
}

message LogChunk {
  string timestamp = 1;
  string stream = 2; // "stdout" or "stderr"
  string content = 3;
}

message GetRunnerLogsRequest {
  string runner_id = 1;
}

message GetRunnerLogsResponse {
  repeated LogChunk lines = 1;
}

// ----------------------------------------
// Renovate Task Service (OQ #18)
// ----------------------------------------

service RenovateService {
  // Manually trigger a Renovate run for a pool
  rpc TriggerRenovateRun (TriggerRenovateRunRequest) returns (TriggerRenovateRunResponse);

  // Get current status of Renovate runs for a pool
  rpc GetRenovateStatus (GetRenovateStatusRequest) returns (GetRenovateStatusResponse);

  // List historical Renovate runs
  rpc ListRenovateHistory (ListRenovateHistoryRequest) returns (ListRenovateHistoryResponse);
}

message RenovateRun {
  int64 id = 1;
  int64 pool_id = 2;
  string status = 3; // "running", "success", "failure"
  string started_at = 4;
  string completed_at = 5;
  string summary = 6;
}

message TriggerRenovateRunRequest {
  int64 pool_id = 1;
}

message TriggerRenovateRunResponse {
  bool success = 1;
  int64 run_id = 2;
}

message GetRenovateStatusRequest {
  int64 pool_id = 1;
}

message GetRenovateStatusResponse {
  RenovateRun last_run = 1;
  string next_scheduled_run = 2;
}

message ListRenovateHistoryRequest {
  int64 pool_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListRenovateHistoryResponse {
  repeated RenovateRun runs = 1;
  int32 total_count = 2;
}

// ----------------------------------------
// Image Update Service (OQ #16)
// ----------------------------------------

service ImageUpdateService {
  // Check whether a newer image is available for a pool
  rpc CheckImageUpdate (CheckImageUpdateRequest) returns (CheckImageUpdateResponse);

  // Manually trigger pulling updated image
  rpc PullImage (PullImageRequest) returns (PullImageResponse);

  // List pending image updates across pools
  rpc ListImageUpdates (ListImageUpdatesRequest) returns (ListImageUpdatesResponse);

  // Acknowledge / dismiss an image update notification
  rpc DismissImageUpdate (DismissImageUpdateRequest) returns (DismissImageUpdateResponse);
}

message ImageUpdate {
  int64 id = 1;
  int64 pool_id = 2;
  string current_image = 3;
  string latest_digest = 4;
  string status = 5; // "available", "pulling", "pulled", "dismissed"
  string checked_at = 6;
}

message CheckImageUpdateRequest {
  int64 pool_id = 1;
}

message CheckImageUpdateResponse {
  bool update_available = 1;
  ImageUpdate update = 2;
}

message PullImageRequest {
  int64 pool_id = 1;
}

message PullImageResponse {
  bool success = 1;
  string message = 2;
}

message ListImageUpdatesRequest {
  int64 pool_id = 1; // 0 for all
}

message ListImageUpdatesResponse {
  repeated ImageUpdate updates = 1;
}

message DismissImageUpdateRequest {
  int64 id = 1;
}

message DismissImageUpdateResponse {
  bool success = 1;
}
