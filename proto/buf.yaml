version: v1
# protovalidate rule annotations (docs/30 §5.2): rules ride the descriptors,
# evaluated server-side by protovalidate-go and client-side by protovalidate-es.
deps:
  - buf.build/bufbuild/protovalidate
breaking:
  use:
    - FILE
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_RESPONSE_STANDARD_NAME
    # LogChunk is the deliberate shared log-entry message: streamed by both
    # StreamRunnerLogs and StreamSupervisorLog (docs/29 §5.1).
    - RPC_REQUEST_RESPONSE_UNIQUE
