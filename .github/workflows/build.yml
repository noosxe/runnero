name: CI/CD Runner Multi-Arch Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Define limited execution permissions for GITHUB_TOKEN
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/runnero

jobs:
  # Cheap gate job: detects whether any runner-image input changed.
  # The multi-arch build matrix is expensive (native arm64 + amd64), so it
  # should only run when the image context (Dockerfile, src scripts) or this
  # workflow itself is touched - not for orchestrator/frontend-only PRs.
  changes:
    name: Detect Relevant Changes
    # Release tags skip detection entirely and build unconditionally
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Push events diff against the previous commit and need full
          # history; pull_request events resolve changed files via the
          # GitHub REST API (paths-filter, pull-requests: read) and only
          # need a shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/**'
              - '.github/workflows/build.yml'

  build:
    name: Build Native Image
    needs: changes
    # Release tags always build; otherwise only when image inputs changed or manually triggered.
    # always() keeps this job schedulable even though `changes` is skipped on tags.
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform-suffix: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Set up Docker Buildx for advanced builder caching features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GitHub Container Registry (GHCR) only when creating a release (tag push)
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image. If a tag is pushed, it pushes by digest directly to GHCR.
      # If not a tag, it performs a native dry-run compilation locally to verify correctness.
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name={0},push-by-digest=true,name-canonical=true', env.IMAGE_NAME) || '' }}
          # Use Actions cache backend for extremely fast subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Export the unique digest for manifest stitching on releases
      - name: Export Digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Upload the digest file as an artifact
      - name: Upload Digest Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform-suffix }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    name: Merge Manifests & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Set up Docker Buildx to enable imagetools execution
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Download all exported digests from parallel build matrix jobs
      - name: Download Digest Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      # Log in to GitHub Container Registry to authorize the release manifest push
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Merge all digests into a unified multi-architecture manifest and tag it
      - name: Stitch Manifests & Publish Release
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${{ github.ref_name }}" \
            -t "${IMAGE_NAME}:latest" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      # Create an official GitHub Release for the pushed tag
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

