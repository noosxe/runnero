name: CI/CD Runner Multi-Arch Build

# Image-recipe validation only (pull requests, main pushes, manual dispatch):
# natively compiles the runner image for amd64 and arm64 WITHOUT pushing.
# Releases publish this image from the self-contained release.yml — this
# workflow never runs on tags.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Define limited execution permissions for GITHUB_TOKEN
permissions:
  contents: read
jobs:
  # Cheap gate job: detects whether any runner-image input changed.
  # The multi-arch build matrix is expensive (native arm64 + amd64), so it
  # should only run when the image context (Dockerfile, src scripts) or this
  # workflow itself is touched - not for orchestrator/frontend-only PRs.
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Push events diff against the previous commit and need full
          # history; pull_request events resolve changed files via the
          # GitHub REST API (paths-filter, pull-requests: read) and only
          # need a shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/**'
              - '.github/workflows/build.yml'

  build:
    name: Build Native Image
    needs: changes
    # Runs on manual dispatch or when image inputs changed in a PR/push.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform-suffix: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Set up Docker Buildx for advanced builder caching features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Native dry-run compilation to verify the image recipe builds.
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          # Use Actions cache backend for extremely fast subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
