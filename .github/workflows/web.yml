name: Web CI

# Automated frontend checks: Oxlint, Oxfmt, Vitest suites, and production build.
# Path-filtered so Go/image-only changes do not trigger frontend runners;
# the workflow always includes itself so CI definition changes are validated.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository (AGENTS.md security rules)
permissions:
  contents: read

jobs:
  # Cheap gate job: detects whether Web frontend source, schemas, or workflow definitions changed.
  changes:
    name: Detect Web Changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Push events diff against the previous commit and need full
          # history; pull_request events resolve changed files via the
          # GitHub REST API (paths-filter, pull-requests: read) and only
          # need a shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'proto/**'
              - '.github/workflows/web.yml'

  web-ci:
    name: Lint, Test & Build (Web UI)
    needs: changes
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint (Oxlint)
        working-directory: web
        run: pnpm run lint

      - name: Format Check (Oxfmt)
        working-directory: web
        run: pnpm run format:check

      - name: Test (Vitest)
        working-directory: web
        run: pnpm test

      - name: Build (TypeScript + Vite)
        working-directory: web
        run: pnpm run build
