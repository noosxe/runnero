name: Go CI

# Build, vet, and test the Go module (repo root) on every PR and on pushes
# to main. Cheap path filtering skips docs/image-only changes, mirroring the
# gating strategy of build.yml — but this workflow always includes itself so
# changes to the CI definition are validated by the CI they define.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository (AGENTS.md security rules)
permissions:
  contents: read

jobs:
  # Cheap gate job: detects whether Go source, schemas, or build definitions changed.
  # The native arm64 + amd64 test matrix only runs when Go-relevant inputs change (docs/11).
  changes:
    name: Detect Go Changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Push events diff against the previous commit and need full
          # history; pull_request events resolve changed files via the
          # GitHub REST API (paths-filter, pull-requests: read) and only
          # need a shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'proto/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/go.yml'

  # Build the embedded web UI once per run: both matrix legs need web/dist
  # for the go:embed in web/embed.go. Sharing one artifact avoids running
  # pnpm install + vite build twice (once per architecture).
  web-assets:
    name: Build Web Assets
    needs: changes
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload Web Assets
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  # golangci-lint gate (matches `make lint`): default linters plus the gofmt
  # formatter declared in .golangci.yml. Runs golangci-lint v2 pinned to
  # the exact version from the Nix dev shell so CI and local gates can
  # never disagree. Depends on web-assets because lint analysis compiles
  # the module and go:embed in web/embed.go requires web/dist.
  lint:
    name: Go Lint
    needs: [changes, web-assets]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Same artifact as the build-test legs: lint needs the embedded web
      # assets present to type-check the module.
      - name: Download Web Assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Exact pin: must match the golangci-lint version in the Nix dev
          # shell (currently 2.12.2). Keep the two in sync on upgrades.
          version: v2.12.2
  build-test:
    name: Build & Test (${{ matrix.arch }})
    needs: [changes, web-assets]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      # Report failures on both architectures instead of cancelling the
      # sibling leg; the matrix uses native runners (no QEMU), same mapping
      # as the image build in build.yml.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # The supervisor is strictly CGO-free (docs/06 §1, Makefile): pure-Go
      # stack for seamless ARM64/AMD64 builds without a C toolchain.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Resolve the toolchain from go.mod so CI never drifts from the
          # module definition. Module/build cache is keyed on go.sum.
          go-version-file: go.mod
          cache: true

      # web/dist is built once in the web-assets job and shared with both
      # matrix legs (go:embed in web/embed.go needs it at compile time).
      - name: Download Web Assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      # No standalone `go build` step: `go vet` and `go test` below already
      # compile every package in the module.

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Race detection rebuilds the module with CGO instrumentation and
      # roughly doubles test time; a single architecture is sufficient to
      # catch races, so only the amd64 leg pays for it.
      - name: Test (Data Race Detector)
        if: matrix.arch == 'amd64'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
