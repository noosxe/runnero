name: E2E Suite

# Containerized Playwright end-to-end suite (docs/13). Runs nightly and on
# every pull request / main push that touches E2E-relevant inputs; the
# workflow always includes itself so changes to the CI definition are
# validated by the CI they define.
#
# The suite boots its own compose stack (mock provider, mock Docker,
# supervisor, Playwright) on official GitHub-hosted runners (ubuntu-latest),
# which ship Docker with the compose plugin. The project no longer
# dogsfoods its own runner pool for CI (RUN-291): each job gets a fresh,
# ephemeral VM, so base and compose-built images start cold every run —
# the accepted tradeoff for CI independence from the product's own
# infrastructure.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Nightly at 03:17 UTC (off the top-of-hour GitHub cron congestion). The
    # schedule is the rot guardian: it runs the full suite unconditionally,
    # catching drift that path filtering would rightly skip (e.g. a pinned
    # Playwright browser breaking against an updated base image).
    - cron: '17 3 * * *'
  workflow_dispatch:

# The compose stack uses fixed container names (project `runnero-e2e`). Each
# job now runs on its own ephemeral VM, so concurrent suites cannot collide —
# but the repo-wide group is kept deliberately: at most one suite (and its
# several-minute cold image build) runs at a time, and in-progress runs are
# never cancelled — a PR landing mid-nightly must not kill the guardian run
# halfway through (RUN-131).
concurrency:
  # `-v2` suffix: the original `e2e-suite` slot is held forever by a stranded run
  # that queued for runner labels which never existed (queued runs on
  # unavailable labels cannot be cancelled and never complete).
  group: e2e-suite-v2
  cancel-in-progress: false

# Least privilege: these jobs only read the repository (AGENTS.md security rules)
permissions:
  contents: read

jobs:
  # Cheap gate job: detects whether E2E-relevant inputs changed. The suite only
  # runs on matching pull requests / main pushes; schedules and manual dispatch
  # always run (docs/11 §4).
  changes:
    name: Detect E2E-Relevant Changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Push events diff against the previous commit and need full
          # history; pull_request events resolve changed files via the
          # GitHub REST API (paths-filter, pull-requests: read) and only
          # need a shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'tests/e2e/**'
              - 'web/**'
              - 'cmd/**'
              - 'internal/**'
              - 'proto/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile.supervisor'
              - 'Makefile'
              - '.github/workflows/e2e.yml'

  # The suite runs on a GitHub-hosted runner: Docker and the compose plugin are
  # preinstalled, so `make test-e2e` boots the compose stack on the job's own
  # ephemeral VM — no shared engine, no host state left behind afterwards.
  e2e:
    name: Playwright E2E
    needs: changes
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.changes.outputs.e2e == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run E2E Suite
        # The fork guard above (RUN-131) predates the hosted-runner switch and
        # is kept as a cost/discipline measure: the job carries no secrets and
        # runs on an ephemeral VM, so fork PRs would be safe to run — they just
        # don't get free suite minutes.
        run: make test-e2e

      # No teardown step: the job's VM is ephemeral and discarded whole when the
      # job ends (even on timeout), so there is no shared host state to clean.
