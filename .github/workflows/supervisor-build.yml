name: CI/CD Supervisor Multi-Arch Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Define limited execution permissions for GITHUB_TOKEN
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/runnero-supervisor

jobs:
  # Cheap gate job: detects whether supervisor-relevant inputs changed.
  # Native multi-arch matrix (amd64 + arm64) only runs when relevant files change.
  changes:
    name: Detect Supervisor Changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Resolved by the select step below: narrow filter on pull requests,
      # broad filter on pushes to main and manual dispatch.
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Push events diff against the previous commit and need full
          # history; pull_request events resolve changed files via the
          # GitHub REST API (paths-filter, pull-requests: read) and only
          # need a shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Narrow on pull requests: Go/web correctness is already
            # validated by go.yml / web.yml, so a PR only needs to prove
            # the image recipe itself still builds.
            image-pr:
              - 'Dockerfile.supervisor'
              - '.dockerignore'
              - 'deploy/supervisor/**'
              - '.github/workflows/supervisor-build.yml'
            # Broad on pushes to main and manual dispatch: release images
            # must always be proven against the full build context.
            image-push:
              - 'Dockerfile.supervisor'
              - '.dockerignore'
              - 'deploy/supervisor/**'
              - 'cmd/**'
              - 'internal/**'
              - 'proto/**'
              - 'web/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/supervisor-build.yml'

      # Pick the filter result for this event: pull requests use the
      # narrow image-pr filter; pushes to main and manual dispatch use the
      # broad image-push filter. (Plain expression ternaries are unsafe
      # here: a 'false' string output is truthy in GitHub expressions.)
      - name: Select Filter Result
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=${{ steps.filter.outputs.image-pr }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ steps.filter.outputs.image-push }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Native Supervisor Image
    needs: changes
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform-suffix: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.supervisor
          platforms: ${{ matrix.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name={0},push-by-digest=true,name-canonical=true', env.IMAGE_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}

      - name: Export Digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: supervisor-digests-${{ matrix.platform-suffix }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    name: Merge Manifests & Publish Supervisor Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download Digest Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: supervisor-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch Manifests & Publish Release
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${{ github.ref_name }}" \
            -t "${IMAGE_NAME}:latest" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      # Create or update official GitHub Release for the pushed tag
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping create."
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
