name: CI/CD Supervisor Multi-Arch Build

# Supervisor-image recipe validation only (pull requests, main pushes, manual
# dispatch): natively compiles the supervisor image for amd64 and arm64
# WITHOUT pushing. Releases publish this image from the self-contained
# release.yml — this workflow never runs on tags.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Define limited execution permissions for GITHUB_TOKEN
permissions:
  contents: read
jobs:
  # Cheap gate job: detects whether supervisor-relevant inputs changed.
  # Native multi-arch matrix (amd64 + arm64) only runs when relevant files change.
  changes:
    name: Detect Supervisor Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Resolved by the select step below: narrow filter on pull requests,
      # broad filter on pushes to main and manual dispatch.
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Push events diff against the previous commit and need full
          # history; pull_request events resolve changed files via the
          # GitHub REST API (paths-filter, pull-requests: read) and only
          # need a shallow checkout.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Narrow on pull requests: Go/web correctness is already
            # validated by go.yml / web.yml, so a PR only needs to prove
            # the image recipe itself still builds.
            image-pr:
              - 'Dockerfile.supervisor'
              - '.dockerignore'
              - 'deploy/supervisor/**'
              - '.github/workflows/supervisor-build.yml'
            # Broad on pushes to main and manual dispatch: release images
            # must always be proven against the full build context.
            image-push:
              - 'Dockerfile.supervisor'
              - '.dockerignore'
              - 'deploy/supervisor/**'
              - 'cmd/**'
              - 'internal/**'
              - 'proto/**'
              - 'web/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/supervisor-build.yml'

      # Pick the filter result for this event: pull requests use the
      # narrow image-pr filter; pushes to main and manual dispatch use the
      # broad image-push filter. (Plain expression ternaries are unsafe
      # here: a 'false' string output is truthy in GitHub expressions.)
      - name: Select Filter Result
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=${{ steps.filter.outputs.image-pr }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ steps.filter.outputs.image-push }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Native Supervisor Image
    needs: changes
    # Runs on manual dispatch or when supervisor inputs changed in a PR/push.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform-suffix: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.supervisor
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}


